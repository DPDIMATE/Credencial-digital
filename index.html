<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi credencial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <article class="credencial">
    <header class="encabezado">
        <div class="avatar-contenedor">
            <img src="img/avatar.jpg" alt="Foto perfil Diana">
            <span class="estado-online">ONLINE</span>
        </div>
        <span class="insignia">EN FORMACIÓN</span>
    </header>

    <div class="columna-datos">
        <div class="datos-personales">
            <h1>Diana Dimate</h1>
            <span class="linea-neon"></span>
            <p>Java Full Stack Developer en formación</p>
        </div>

        <section class="informacion">
            <p><i class="fa-solid fa-location-dot"></i> Ciudad: Bogotá</p>
            <p class="tecnologia">
            <i class="fa-solid fa-code"></i>
            <span>Tecnología favorita: <strong>JavaScript</strong></span>
            </p>
            <p><i class="fa-solid fa-heart"></i> Pasatiempo: Deporte</p>
            <p><i class="fa-brands fa-github"></i> GitHub: DPDIMATE</p>
            <p><i class="fa-solid fa-envelope"></i> Correo: diana@tecnologia.com</p>
        </section>

        <footer class="pie">
            <p>Aprender, crear y evolucionar</p>
        </footer>
    </div>
</article>
</body>
</html>
